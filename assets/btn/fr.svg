  <clipPath id="clip"><rect x="12" y="10" width="696" height="98" rx="28"/></clipPath>
  <filter id="soft" x="-10%" y="-30%" width="120%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
