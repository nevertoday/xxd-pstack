<text x="480.0" y="252" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="400" fill="#6D6B67" text-anchor="middle" >Every task goes through these four steps. You don't have to manage the middle two, but you can see all of it in the todo list.</text>
