<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Letting the AI run overnight: each round it checks the done condition, makes the smallest change, verifies, commits or discards, and logs one line; in the morning you read the decision log">
<defs></defs>
<rect x="0" y="0" width="960" height="420" rx="22" fill="#F1EFEA" />
<circle cx="300" cy="205" r="128" fill="none" stroke="#D9D6CE" stroke-width="1.6" stroke-dasharray="3 6"/>
<rect x="242.0" y="60.0" width="116" height="34" rx="17" fill="#EBD6D3" stroke="#E2DED6" stroke-width="1.5"><animate attributeName="stroke" dur="8.0s" begin="0.00s" repeatCount="indefinite" keyTimes="0;0.04;0.16;0.2;1" values="#E2DED6;#2B2A27;#2B2A27;#E2DED6;#E2DED6"/></rect>
<text x="300.0" y="82.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#2B2A27" text-anchor="middle" >Check if done</text>
<rect x="354.73523408577967" y="148.44582472000673" width="134" height="34" rx="17" fill="#EFDFC9" stroke="#E2DED6" stroke-width="1.5"><animate attributeName="stroke" dur="8.0s" begin="1.60s" repeatCount="indefinite" keyTimes="0;0.04;0.16;0.2;1" values="#E2DED6;#2B2A27;#2B2A27;#E2DED6;#E2DED6"/></rect>
<text x="421.73523408577967" y="170.44582472000673" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#2B2A27" text-anchor="middle" >Smallest change</text>
<rect x="304.2365122934366" y="291.5541752799933" width="142" height="34" rx="17" fill="#DDE7D3" stroke="#E2DED6" stroke-width="1.5"><animate attributeName="stroke" dur="8.0s" begin="3.20s" repeatCount="indefinite" keyTimes="0;0.04;0.16;0.2;1" values="#E2DED6;#2B2A27;#2B2A27;#E2DED6;#E2DED6"/></rect>
<text x="375.2365122934366" y="313.5541752799933" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#2B2A27" text-anchor="middle" >Check real output</text>
<rect x="165.26348770656347" y="291.5541752799933" width="119" height="34" rx="17" fill="#D7E2EC" stroke="#E2DED6" stroke-width="1.5"><animate attributeName="stroke" dur="8.0s" begin="4.80s" repeatCount="indefinite" keyTimes="0;0.04;0.16;0.2;1" values="#E2DED6;#2B2A27;#2B2A27;#E2DED6;#E2DED6"/></rect>
<text x="224.76348770656347" y="313.5541752799933" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#2B2A27" text-anchor="middle" >Commit / drop</text>
<rect x="126.26476591422033" y="148.44582472000675" width="104" height="34" rx="17" fill="#E0DAEA" stroke="#E2DED6" stroke-width="1.5"><animate attributeName="stroke" dur="8.0s" begin="6.40s" repeatCount="indefinite" keyTimes="0;0.04;0.16;0.2;1" values="#E2DED6;#2B2A27;#2B2A27;#E2DED6;#E2DED6"/></rect>
<text x="178.26476591422033" y="170.44582472000675" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#2B2A27" text-anchor="middle" >Log one line</text>
<circle r="5" fill="#2B2A27"><animateMotion dur="8.0s" repeatCount="indefinite" path="M300,77 a128,128 0 1,1 -0.01,0"/></circle>
<text x="300" y="199" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" fill="#8A867D" text-anchor="middle" >Each round</text>
<text x="300" y="223" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#2B2A27" text-anchor="middle" >1 change · 1 check · 1 log line</text>
<rect x="560" y="44" width="360" height="196" rx="12" fill="#1A1A1A" />
<text x="580" y="78" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#D7B9C8" text-anchor="start" >/poteto-mode I'm going to bed.</text>
<text x="580" y="105" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#E6E4DC" text-anchor="start" >Start a fresh worktree from main</text>
<text x="580" y="132" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#E6E4DC" text-anchor="start" >and move callers to the new parser.</text>
<text x="580" y="159" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#9CC59E" text-anchor="start" >Done: 0 old callers, all tests pass.</text>
<text x="580" y="186" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#E6E4DC" text-anchor="start" >Log decisions. Commit without asking.</text>
<text x="580" y="213" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#EFDFC9" text-anchor="start" >/loop until done; if stuck, say why.</text>
<rect x="560" y="258" width="360" height="112" rx="12" fill="#FBFAF8" stroke="#E2DED6" />
<text x="580" y="288" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#2B2A27" text-anchor="start" >☀ Next morning</text>
<text x="580" y="316" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#2B2A27" text-anchor="start" >/show-me-your-work recap last night</text>
<text x="580" y="346" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="400" fill="#8A867D" text-anchor="start" >Read “needs attention”, then the lines it points to.</text>
</svg>
