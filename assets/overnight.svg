<rect x="306.2365122934366" y="291.5541752799933" width="138" height="34" rx="17" fill="#DDE7D3" stroke="#E2DED6" stroke-width="1.5"><animate attributeName="stroke" dur="8.0s" begin="3.20s" repeatCount="indefinite" keyTimes="0;0.04;0.16;0.2;1" values="#E2DED6;#2B2A27;#2B2A27;#E2DED6;#E2DED6"/></rect>
<text x="375.2365122934366" y="313.5541752799933" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#2B2A27" text-anchor="middle" >对照真实产物验证</text>
<rect x="162.76348770656347" y="291.5541752799933" width="124" height="34" rx="17" fill="#D7E2EC" stroke="#E2DED6" stroke-width="1.5"><animate attributeName="stroke" dur="8.0s" begin="4.80s" repeatCount="indefinite" keyTimes="0;0.04;0.16;0.2;1" values="#E2DED6;#2B2A27;#2B2A27;#E2DED6;#E2DED6"/></rect>
<text x="224.76348770656347" y="313.5541752799933" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#2B2A27" text-anchor="middle" >提交 / 丢弃</text>
<rect x="123.26476591422033" y="148.44582472000675" width="110" height="34" rx="17" fill="#E0DAEA" stroke="#E2DED6" stroke-width="1.5"><animate attributeName="stroke" dur="8.0s" begin="6.40s" repeatCount="indefinite" keyTimes="0;0.04;0.16;0.2;1" values="#E2DED6;#2B2A27;#2B2A27;#E2DED6;#E2DED6"/></rect>
<text x="178.26476591422033" y="170.44582472000675" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#2B2A27" text-anchor="middle" >日志里记一行</text>
<circle r="5" fill="#2B2A27"><animateMotion dur="8.0s" repeatCount="indefinite" path="M300,77 a128,128 0 1,1 -0.01,0"/></circle>
<text x="300" y="199" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" fill="#8A867D" text-anchor="middle" >每一轮</text>
<text x="300" y="223" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="13.5" font-weight="600" fill="#2B2A27" text-anchor="middle" >一次改动 · 一次检查 · 一行日志</text>
<rect x="560" y="44" width="360" height="196" rx="12" fill="#1A1A1A" />
<text x="580" y="78" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#D7B9C8" text-anchor="start" >/poteto-mode 我要去睡了。</text>
<text x="580" y="105" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#E6E4DC" text-anchor="start" >从 main 新开一个 worktree，</text>
<text x="580" y="132" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#E6E4DC" text-anchor="start" >把调用方迁到新的解析器。</text>
<text x="580" y="159" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#9CC59E" text-anchor="start" >完成：旧调用方 0 个，测试全过。</text>
<text x="580" y="186" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#E6E4DC" text-anchor="start" >记决策日志。提交前不用问我。</text>
<text x="580" y="213" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#EFDFC9" text-anchor="start" >/loop 直到完成；卡住就写清原因。</text>
<rect x="560" y="258" width="360" height="112" rx="12" fill="#FBFAF8" stroke="#E2DED6" />
<text x="580" y="288" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#2B2A27" text-anchor="start" >☀ 第二天早上</text>
<text x="580" y="316" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="400" fill="#2B2A27" text-anchor="start" >/show-me-your-work 讲讲昨晚做了什么</text>
<text x="580" y="346" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="400" fill="#8A867D" text-anchor="start" >先读「需要注意」，再看它指向的那几行日志。</text>
</svg>
